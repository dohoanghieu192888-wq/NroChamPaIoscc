name: NroChamPa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build NroChamPa IPA
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      # Download source code and the real Git LFS files.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      # Fail early with a clear message if LFS did not materialise.
      - name: Check Unity libraries
        shell: bash
        run: |
          set -euo pipefail
          for f in Libraries/libiPhone-lib.a Libraries/libil2cpp.a Libraries/baselib.a; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              exit 1
            fi
            if head -c 100 "$f" | grep -q 'git-lfs.github.com/spec'; then
              echo "::error file=$f::Git LFS pointer detected instead of a real library."
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_15.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-ipa.sh 2>&1 | tee "$RUNNER_TEMP/NroChamPa-build.log"

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "== Static library file types =="
          find Libraries -type f -name '*.a' -exec file {} \; 2>/dev/null || true
          echo
          echo "== Last build log lines =="
          if [ -f "$RUNNER_TEMP/NroChamPa-build.log" ]; then
            tail -n 150 "$RUNNER_TEMP/NroChamPa-build.log"
          fi

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/*.ipa
          unzip -t build/*.ipa >/dev/null
          unzip -Z1 build/*.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NroChamPa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30
